name: zad_alsaereen
description: "زاد السائرين - تطبيق حسيني وديني عام"
publish_to: 'none'
version: 2.4.3+48

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # المكتبات الأساسية والاتصالات
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  just_audio: ^0.9.43
  audio_service: ^0.18.15
  intl: ^0.20.2
  geolocator: ^11.0.0
  go_router: ^14.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  crypto: ^3.0.5
  youtube_explode_dart: ">=3.0.0 <4.0.0"
  video_player: ^2.9.2
  pdf: ^3.11.1
  printing: ^5.13.3

  # المكتبات المكتشفة حديثاً للتحريك والمشاركة والصور
  flutter_animate: ^4.5.0
  share_plus: ^10.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.14.4"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/data/

# ─── Real app icon (was still Flutter's default placeholder icon on the
# phone's home screen despite real logo assets already sitting unused in
# assets/icons/ — this points the actual Android/iOS launcher icon at
# them). Generating the final platform-specific icon files still requires
# running `dart run flutter_launcher_icons` once (needs the Flutter SDK,
# which isn't available in this sandbox) — this only adds the correct,
# ready-to-run configuration.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_transparent.png"
