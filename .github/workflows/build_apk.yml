name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      # Real, stable release signing — embedded directly per explicit
      # instruction (private repository). `tr -d '\r\n '` strips any
      # stray whitespace/newlines the base64 text picked up from mobile
      # copy-paste, which was the actual cause of the earlier
      # "Invalid lenByte" corruption.
      - name: Set up release signing
        run: |
          cat > /tmp/keystore_base64.txt <<'B64EOF'
          
          B64EOF
          cat /tmp/keystore_base64.txt | tr -d '\r\n ' | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=AAFR58SzUZCX8VhZb548WSvuAmR1ZEodzUn349zZyM
          keyAlias=ILYA
          keyPassword=AAFR58SzUZCX8VhZb548WSvuAmR1ZEodzUn349zZyM
          EOF

      # Fails fast with a real, specific reason (wrong password, wrong
      # alias, or a corrupted file) instead of letting Gradle hit it deep
      # inside packaging with just "Failed to read key ***: null".
      - name: Verify release keystore is readable
        run: |
          echo "Keystore file size: $(wc -c < android/release.jks) bytes"
          keytool -list -v \
            -keystore android/release.jks \
            -storepass "AAFR58SzUZCX8VhZb548WSvuAmR1ZEodzUn349zZyM" \
            -alias "ILYA" \
            | head -5

      - name: Build APK
        run: >
          flutter build apk --release --android-skip-build-dependency-validation
          --dart-define=TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          --dart-define=TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zad-alsaereen-app
          path: build/app/outputs/flutter-apk/app-release.apk
